<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Shared selection for the sentence-production app</title>
  <desc id="desc">Sentence conditions, phases and the LexTALE range feed selected_data. The average layout input feeds only the average plot. That shared selection feeds a distinct-learner count, an average-pattern plot and an individual-pattern plot. Neither plot requires a new reactive mechanism.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53606a"/></marker>
    <style>
      text{font-family:monospace;font-size:20px;text-anchor:middle;fill:#28323a}
      rect{rx:9;stroke-width:1.5}
      .input{fill:#eaf5f4;stroke:#6ca4a1}
      .reactive{fill:#fff3d6;stroke:#bf9a47}
      .output{fill:#f5f5f5;stroke:#9da5aa}
      .edge{fill:none;stroke:#53606a;stroke-width:2.5;marker-end:url(#arrow)}
      .small{font-family:Arial,sans-serif;font-size:20px}
    </style>
  </defs>
  <rect width="1000" height="430" fill="white" stroke="none"/>
  <path class="edge" d="M260 65C300 65 300 130 350 130"/>
  <path class="edge" d="M260 165H350"/>
  <path class="edge" d="M260 265C300 265 300 200 350 200"/>
  <path class="edge" d="M630 165C680 165 680 65 730 65"/>
  <path class="edge" d="M630 165H730"/>
  <path class="edge" d="M630 165C680 165 680 265 730 265"/>
  <rect class="input" x="10" y="35" width="250" height="60"/>
  <text x="135" y="71" style="font-size:18px">input$prime_condition</text>
  <rect class="input" x="10" y="135" width="250" height="60"/>
  <text x="135" y="171">input$phases</text>
  <rect class="input" x="10" y="235" width="250" height="60"/>
  <text x="135" y="271" style="font-size:18px">input$lextale_range</text>
  <rect class="reactive" x="350" y="90" width="280" height="150"/>
  <text x="490" y="130">selected_data()</text>
  <text class="small" x="490" y="169">select matching summaries</text>
  <text class="small" x="490" y="203">check for an empty selection</text>
  <rect class="output" x="730" y="35" width="260" height="60"/>
  <text x="860" y="71" style="font-size:18px">output$selection_note</text>
  <rect class="output" x="730" y="135" width="260" height="60"/>
  <text x="860" y="171" style="font-size:18px">output$overview_plot</text>
  <rect class="output" x="730" y="235" width="260" height="60"/>
  <text x="860" y="271" style="font-size:18px">output$participant_plot</text>
  <rect class="input" x="350" y="350" width="280" height="60"/>
  <text x="490" y="386" style="font-size:18px">input$average_layout</text>
  <path class="edge" d="M630 380C690 380 690 190 730 175"/>
</svg>
