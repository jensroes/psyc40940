<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">The familiar Week 6 histogram dependencies</title>
  <desc id="desc">The group input supplies the filter, whose selected rows supply the histogram. Bin width affects the histogram directly. A dashed outline shows that filtering and plotting both run inside the same renderPlot block.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#53606a"/></marker>
    <marker id="bin-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#237b80"/></marker>
    <style>
      text {font-family:Arial,sans-serif;font-size:23px;text-anchor:middle;fill:#28323a}
      .code {font-family:monospace;font-size:22px}
      rect {rx:9;stroke-width:1.5}
      .input {fill:#eaf5f4;stroke:#6ca4a1}
      .scope {fill:none;stroke:#b5bcc1;stroke-dasharray:5 4}
      .filter {fill:#fff3d6;stroke:#bf9a47}
      .output {fill:#f5f5f5;stroke:#9da5aa}
      .edge {fill:none;stroke:#53606a;stroke-width:2.5;marker-end:url(#arrow)}
      .bin {fill:none;stroke:#237b80;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#bin-arrow)}
    </style>
  </defs>
  <rect width="1000" height="270" fill="white" stroke="none"/>
  <rect class="scope" x="315" y="35" width="660" height="195"/>
  <text x="645" y="66">inside renderPlot()</text>
  <path class="edge" d="M240 92 C300 92 300 140 360 140"/>
  <path class="edge" d="M540 140 H660"/>
  <path class="bin" d="M240 202 H795 V180"/>
  <rect class="input" x="20" y="60" width="220" height="65"/>
  <text class="code" x="130" y="100">input$modality</text>
  <rect class="input" x="20" y="170" width="220" height="65"/>
  <text class="code" x="130" y="210">input$binwidth</text>
  <rect class="filter" x="360" y="100" width="180" height="80"/>
  <text class="code" x="450" y="131">filter()</text>
  <text x="450" y="161">selected rows</text>
  <rect class="output" x="660" y="100" width="270" height="80"/>
  <text class="code" x="795" y="131">output$rt_plot</text>
  <text x="795" y="161">histogram</text>
</svg>
