<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title id="title">Label the shared-data graph: task</title><desc id="desc">Five boxes A to E with arrows A to C, C to D, C to E, and B to E. Add the input, shared reactive expression and output names from the code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#53606a"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#28323a;text-anchor:middle;font-size:20px} .code{font-family:monospace;font-size:18px} .letter{font-size:17px;font-weight:bold;fill:#58646d} rect{rx:9;stroke-width:1.7} .input{fill:#eaf5f4;stroke:#6ca4a1} .shared{fill:#fff3d6;stroke:#bf9a47} .output{fill:#f5f5f5;stroke:#9da5aa} .edge{fill:none;stroke:#53606a;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="640" height="440" fill="white" stroke="none"/>
<text x="105" y="40">Inputs</text><text x="335" y="40">Shared reactive</text><text x="550" y="40">Outputs</text>
<path class="edge" d="M195 119 C225 119 215 225 245 225"/>
<path class="edge" d="M425 210 C451 210 449 123 475 123"/>
<path class="edge" d="M425 240 C451 240 449 333 475 333"/>
<path class="edge" d="M195 339 C280 416 455 424 550 376"/>
