<text class="code" x="105.0" y="125.0">---</text>
<rect class="input" x="15" y="300" width="180" height="78"/><text class="letter" x="29" y="290">B</text>
<text class="code" x="105.0" y="345.0">---</text>
<rect class="shared" x="245" y="185" width="180" height="80"/><text class="letter" x="259" y="175">C</text>
<text class="code" x="335.0" y="231.0">---</text>
<rect class="output" x="475" y="80" width="150" height="86"/><text class="letter" x="489" y="70">D</text>
